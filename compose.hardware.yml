services:
  backend:
    environment:
      PLC_MODE: serial
      PLC_SERIAL_DEVICE: ${PLC_SERIAL_DEVICE:?Set PLC_SERIAL_DEVICE to a stable Linux device path}
      PLC_SERIAL_GID: ${PLC_SERIAL_GID:?Set PLC_SERIAL_GID to the host group ID that owns the serial device}
    group_add:
      - "${PLC_SERIAL_GID:?Set PLC_SERIAL_GID to the host group ID that owns the serial device}"
    devices:
      - "${PLC_SERIAL_DEVICE}:${PLC_SERIAL_DEVICE}"
    entrypoint:
      - sh
      - -c
      - >-
        mkdir -p /var/lib/microwave-drying-machine/recipes &&
        chown -R app:app /var/lib/microwave-drying-machine &&
        exec gosu 10001:${PLC_SERIAL_GID} uvicorn mwd_backend.app:app --host 0.0.0.0 --port 8000
